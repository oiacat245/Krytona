<!DOCTYPE html>
<html>
<head>
    <title>krytona</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 10px; }
        #input-area { padding: 10px; display: flex; background: #111; }
        input { background: #000; border: 1px solid #333; color: #0f0; flex: 1; padding: 8px; outline: none; }
        button { background: #222; color: #0f0; border: 1px solid #333; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat">krytona chat...</div>
    <div id="input-area">
        <input type="text" id="msg" placeholder="say something..." autocomplete="off">
        <button id="send">send</button>
    </div>

    <!-- sdk do firebase pra fazer o chat funcionar de vdd -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // tu precisa criar um projeto no firebase.google.com e colar as tuas chaves aqui
        const firebaseConfig = {
            apiKey: "AIzaSyCyo-ga7LlfzAOizWVgW7a7nSjMJwN41Jk",
            databaseURL: "https://krytona-548cb-default-rtdb.firebaseio.com",
            projectId: "krytona-548cb",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, "messages");

        const chat = document.getElementById('chat');
        const input = document.getElementById('msg');
        const btn = document.getElementById('send');

        // envia a msg pro banco de dados
        btn.onclick = () => {
            if (input.value.trim()) {
                push(chatRef, { text: input.value });
                input.value = "";
            }
        };

        // recebe a msg do banco e mostra pra todo mundo
        onChildAdded(chatRef, (data) => {
            const p = document.createElement('p');
            p.textContent = "> " + data.val().text;
            chat.appendChild(p);
            chat.scrollTop = chat.scrollHeight;
        });

        input.onkeypress = (e) => { if (e.key === "Enter") btn.click(); };
    </script>
</body>
</html>
